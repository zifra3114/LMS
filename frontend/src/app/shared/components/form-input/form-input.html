<div class="field">
  <label [for]="id" class="field-label">{{ label }}</label>

  <input
    class="field-input"
    [id]="id"
    [name]="name"
    [type]="type"
    [placeholder]="placeholder"
    [autocomplete]="autocomplete"
    [value]="value"
    [required]="required"
    (input)="valueChange.emit($any($event.target).value)"
  />
</div>
