<div class="login-page">
  <div class="login-card">

    <!-- Left: Video panel -->
    <section class="video-panel">
      <video
        class="login-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        aria-hidden="true"
      >
        <!-- Angular 17 or older: src/assets/videos/login-video.mp4 -> "assets/videos/login-video.mp4" -->
        <!-- Angular 18+: public/videos/login-video.mp4 -> "videos/login-video.mp4" -->
        <source src="assets/videos/login-video.mp4" type="video/mp4" />
      </video>

      <div class="video-overlay"></div>

      <div class="video-caption">
        <span class="caption-label">WELCOME TO EDUCORE</span>
        <h2>EXPLORE.<br />LEARN. GROW.</h2>
        <p>One platform. Endless possibilities.</p>
      </div>
    </section>

    <!-- Right: Login form -->
    <section class="form-panel">
      <div class="brand-logo">E</div>

      <h1>WELCOME BACK</h1>
      <p class="form-subtitle">
        Enter your email and password to access your account
      </p>

      <form class="login-form" (submit)="onSubmit($event)">
        <app-form-input
          id="admin-email"
          name="email"
          label="Email"
          type="email"
          placeholder="Enter your email"
          autocomplete="username"
          [required]="true"
          [value]="email"
          (valueChange)="email = $event"
        />

        <app-form-input
          id="admin-password"
          name="password"
          label="Password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          [required]="true"
          [value]="password"
          (valueChange)="password = $event"
        />

        <div class="form-options">
          <label class="remember-option">
            <input type="checkbox" name="rememberMe" />
            <span>Remember me</span>
          </label>

          <a href="#" (click)="onForgotPassword($event)">Forgot Password</a>
        </div>

        <app-button type="submit">Sign In</app-button>
      </form>

      <div class="secure-note">
        <span class="secure-line"></span>
        <span>SECURE ADMIN ACCESS</span>
        <span class="secure-line"></span>
      </div>

      <p class="bottom-note">Authorized administrators only.</p>
    </section>

  </div>
</div>
