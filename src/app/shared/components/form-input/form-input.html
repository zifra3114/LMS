
<div class="w-full">
  <label
    [for]="id"
    class="mb-2 block text-sm font-semibold text-slate-700"
  >
    {{ label }}
  </label>

  <input
    [id]="id"
    [name]="name"
    [type]="type"
    [placeholder]="placeholder"
    [autocomplete]="autocomplete"
    [value]="value"
    [required]="required"
    (input)="valueChange.emit($any($event.target).value)"
    class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3.5 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
  />
</div>
