
<button
  [type]="type"
  [disabled]="isDisabled"
  class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 px-5 py-3.5 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 transition hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-500/20 disabled:cursor-not-allowed disabled:opacity-60"
>
  @if (loading) {
    <span class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
    Please wait...
  } @else {
    <ng-content />
  }
</button>
