
<button
  [type]="type"
  [disabled]="isDisabled"
  class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-slate-950 px-5 py-3.5 text-sm font-semibold text-white shadow-lg shadow-slate-950/20 transition duration-200 hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-500/20 disabled:cursor-not-allowed disabled:opacity-60 dark:bg-blue-600 dark:hover:bg-blue-700 dark:shadow-blue-900/30"
>
  @if (loading) {
    <span
      class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
    ></span>
    Please wait...
  } @else {
    <ng-content />
  }
</button>
